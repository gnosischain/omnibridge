name: release

on:
  release:
    types: [created]

permissions:
  contents: write # upload the release asset

jobs:
  flats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
        if: ${{ !steps.yarn-cache.outputs.cache-hit }}
      - run: yarn flatten
      - name: Zip flattened contracts
        run: zip "omnibridge-contracts-flattened-${TAG}.zip" $(find flats -name '*.sol')
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Upload to the release
        run: gh release upload "$TAG" "omnibridge-contracts-flattened-${TAG}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
