name: release

on:
  release:
    types: [created]

permissions:
  contents: write # upload the release asset

jobs:
  flats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: yarn-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/yarn.lock') }}
      - run: yarn
        if: ${{ !steps.yarn-cache.outputs.cache-hit }}
      - run: yarn flatten
      - name: Zip flattened contracts
        run: zip "omnibridge-contracts-flattened-${TAG}.zip" $(find flats -name '*.sol')
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Upload to the release
        run: gh release upload "$TAG" "omnibridge-contracts-flattened-${TAG}.zip"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
